[package]
name = "ancient-city-morphology"
version = "0.1.0"
edition = "2021"
description = "古代城市遗址空间结构复原与形态演化分析系统后端"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-async-std", "postgres", "chrono", "json", "postgis"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
dotenv = "0.15"
thiserror = "1.0"
geo-types = "0.7"
geojson = "0.24"
rand = "0.8"
statrs = "0.16"
approx = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
